[tool.mypy]
strict = true
python_version = "3.11"

# sentence-transformers/torch live in requirements-similarity.txt (optional,
# heavy -- same rationale as speech-pipeline's requirements-*.txt).
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

# openai (used as an OpenRouter-compatible client, see
# app/summarization/openrouter_provider.py) lives in
# requirements-summarization.txt, not requirements-dev.txt -- same
# ordinary-dev-installs-stay-lightweight rationale as above. Without this,
# a clean requirements-dev.txt-only install (like CI's) fails mypy on the
# lazy `from openai import AsyncOpenAI` inside OpenRouterSummarizer.__init__,
# even though that import is never reached unless the real provider is
# actually instantiated.
[[tool.mypy.overrides]]
module = ["openai", "openai.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
