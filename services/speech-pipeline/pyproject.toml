[tool.mypy]
strict = true
# 3.12, not 3.11 like the other three services: numpy's own .pyi stubs (a
# real dependency here since Phase 6's emotion classifier -- see
# requirements-dev.txt) use PEP 695 `type` statement syntax, which mypy
# refuses to parse in stub files when python_version < 3.12, independent of
# what our own code uses. The project's actual minimum supported runtime
# (README.md: "Python 3.11+") is unaffected -- this only controls what
# syntax mypy assumes is available while type-checking, not what ships.
python_version = "3.12"

# faster_whisper lives in requirements-asr.txt (optional, heavy -- see that
# file's comment), not requirements-dev.txt, so mypy can't see its types in
# a base dev install. Real type-checking of faster_whisper_provider.py
# happens when the ASR extras are installed. numpy is NOT in this override
# (unlike the other three services' equivalent) -- it's a real
# requirements-dev.txt dependency here (Phase 6), so its real stubs should
# be checked, not silently treated as Any.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

# transformers/torch live in requirements-mt.txt (optional, heavy -- same
# rationale as requirements-asr.txt above).
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

# speechbrain lives in requirements-diarization.txt (optional, heavy -- same
# rationale as above). torch is already covered by the override above.
[[tool.mypy.overrides]]
module = ["speechbrain", "speechbrain.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
