[tool.mypy]
strict = true
python_version = "3.11"

# faster_whisper/numpy live in requirements-asr.txt (optional, heavy --
# see that file's comment), not requirements-dev.txt, so mypy can't see
# their types in a base dev install. Real type-checking of
# faster_whisper_provider.py happens when the ASR extras are installed.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "numpy", "numpy.*"]
ignore_missing_imports = true

# transformers/torch live in requirements-mt.txt (optional, heavy -- same
# rationale as requirements-asr.txt above).
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
