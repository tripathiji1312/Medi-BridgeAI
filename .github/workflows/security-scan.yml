name: security-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --audit-level=high
        continue-on-error: true # TODO(Phase 1+): make blocking once findings are triaged/fixed

  python-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [speech-pipeline, clinical-nlp, vision-service, orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r services/${{ matrix.service }}/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # TODO(Phase 1+ as real code accumulates): Semgrep/Bandit static analysis
  # (Blueprint Section 13.1 stage 5) — deferred until there is non-scaffold
  # business logic worth statically analyzing.
