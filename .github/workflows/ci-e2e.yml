name: ci-e2e

# Playwright E2E suite against real gateway/speech-pipeline/clinical-nlp/
# orchestrator processes running in MEDIBRIDGE_FIXTURE_MODE (deterministic
# canned ASR/MT/TTS/diarization/similarity responses -- no model downloads,
# but a genuine WebSocket + cross-service HTTP round trip through the real
# application code). Not a required PR status check per Blueprint Section
# 13.2 (only lint/unit/integration/security/model-eval are) -- runs
# nightly + on demand per Section 13.1 stage 6.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Set up Python service venvs (fixture-mode deps only, no ML extras)
        run: |
          for service in speech-pipeline clinical-nlp orchestrator; do
            python -m venv services/$service/.venv
            services/$service/.venv/bin/pip install -r services/$service/requirements-dev.txt
          done
      - run: npm run e2e --workspace=apps/web
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
