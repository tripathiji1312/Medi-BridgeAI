# Local dev stack. Not smoke-tested in this environment yet (Docker not installed
# in the Phase 0 build sandbox) — see docs/PROGRESS.md "Deferred" for verification steps.
# Run from repo root: docker compose -f infra/docker/docker-compose.dev.yml up
name: medibridge-dev

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: medibridge
      POSTGRES_USER: medibridge
      POSTGRES_PASSWORD: dev-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medibridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev-only-change-me
      MINIO_ROOT_PASSWORD: dev-only-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    environment:
      GATEWAY_PORT: 4000
      JWT_SECRET: dev-only-change-me
      # "localhost" here would resolve to the gateway container itself, not
      # speech-pipeline -- must be the Compose service name.
      SPEECH_PIPELINE_WS_URL: ws://speech-pipeline:8001/ws/transcribe
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
      - speech-pipeline

  speech-pipeline:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python-service
      args:
        SERVICE_DIR: services/speech-pipeline
        SERVICE_PORT: 8001
        # Real ASR/MT/diarization models, not just the fixture providers --
        # see Dockerfile.python-service's comment on REQUIREMENTS_FILE for
        # why this override matters.
        REQUIREMENTS_FILE: requirements-full.txt
    ports:
      - "8001:8001"

  clinical-nlp:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python-service
      args:
        SERVICE_DIR: services/clinical-nlp
        SERVICE_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      - postgres

  vision-service:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python-service
      args:
        SERVICE_DIR: services/vision-service
        SERVICE_PORT: 8003
    ports:
      - "8003:8003"

  orchestrator:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python-service
      args:
        SERVICE_DIR: services/orchestrator
        SERVICE_PORT: 8004
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
  minio-data:
